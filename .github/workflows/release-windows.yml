name: Release Windows

on:
  workflow_dispatch:
  push:
    branches: [ MINER ]
    tags:
      - "v*"

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

permissions:
  contents: read

jobs:
  build-release-windows:
    name: Windows MSVC PRIME release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat"

      - name: Install release dependencies
        run: |
          & "$env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe" install --triplet x64-windows openssl gmp boost-integer boost-multiprecision

      - name: Configure CMake
        # This workflow intentionally provisions GMP; CMake uses MPIR when present,
        # otherwise it falls back to GMP for PRIME bigint linkage.
        # GMPDIR must be an *environment* variable — FindGMP.cmake consumes $ENV{GMPDIR},
        # not a CMake cache variable.  Set it here so the find_path/find_library hints work.
        env:
          GMPDIR: "${{ github.workspace }}/vcpkg/installed/x64-windows"
        run: >
          cmake --preset windows-msvc
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DWITH_PRIME=ON
          -DNEXUSMINER_STATIC_OPENSSL=OFF

      - name: Build
        run: cmake --build --preset windows-msvc

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "${{ github.workspace }}\dist\windows-msvc\NexusMiner-windows"
          $zip = "${{ github.workspace }}\dist\windows-msvc\NexusMiner-windows-msvc.zip"
          $sha = "${{ github.workspace }}\dist\windows-msvc\SHA256SUMS.txt"
          New-Item -ItemType Directory -Force -Path "$stage\configs" | Out-Null
          Copy-Item "${{ github.workspace }}\build\windows-msvc\Release\NexusMiner.exe" "$stage\NexusMiner.exe" -Force
          Copy-Item "${{ github.workspace }}\README.md" "$stage\README.md" -Force
          # Copy both *.config and *.conf; silently skip whichever glob is empty.
          foreach ($pat in @("*.config", "*.conf")) {
            Get-ChildItem "${{ github.workspace }}\configs\$pat" -ErrorAction SilentlyContinue |
              ForEach-Object { Copy-Item $_.FullName "$stage\configs\" -Force }
          }

          $dllCandidates = @(
            "${{ github.workspace }}\vcpkg\installed\x64-windows\bin\libcrypto-3-x64.dll",
            "${{ github.workspace }}\vcpkg\installed\x64-windows\bin\libssl-3-x64.dll",
            "${{ github.workspace }}\vcpkg\installed\x64-windows\bin\gmp-10.dll"
          )
          foreach ($dll in $dllCandidates) {
            if (Test-Path $dll) {
              Copy-Item $dll $stage -Force
            }
          }

          if (Test-Path $zip) { Remove-Item $zip -Force }
          # Compress the stage directory itself (not its contents) so the ZIP contains
          # a top-level NexusMiner-windows/ folder, matching the MinGW cross-package layout.
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  NexusMiner-windows-msvc.zip" | Out-File -FilePath $sha -Encoding ascii

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexusMiner-windows-msvc
          path: |
            dist/windows-msvc/NexusMiner-windows-msvc.zip
            dist/windows-msvc/SHA256SUMS.txt
