{
    "_comment": "MASTER REFERENCE CONFIG - Complete documentation of ALL NexusMiner options",
    "_description": "This file documents every available configuration option with descriptions and valid ranges",
    
    "version": 1,
    
    "_section_connection": "Connection Settings",
    "wallet_ip": "127.0.0.1",
    "_wallet_ip_desc": "IP address or hostname of Nexus node (solo mining only)",
    
    "port": 8323,
    "_port_desc": "Port number for stateless miner LLP (default: 8323)",
    
    "local_ip": "0.0.0.0",
    "_local_ip_desc": "Local IP to bind to (0.0.0.0 = all interfaces, works for localhost/VPN/remote)",
    
    "_section_mining": "Mining Settings",
    "mining_mode": "PRIME",
    "_mining_mode_desc": "Mining channel: 'PRIME' or 'HASH'",
    
    "_section_falcon_auth": "Falcon Authentication (REQUIRED for solo mining)",
    "miner_falcon_pubkey": "<YOUR_PUBKEY_HEX>",
    "_falcon_pubkey_desc": "Falcon-512 public key (generate with: ./NexusMiner --create-keys)",
    
    "miner_falcon_privkey": "<YOUR_PRIVKEY_HEX>",
    "_falcon_privkey_desc": "Falcon-512 private key (KEEP SECRET!)",
    
    "enable_block_signing": false,
    "_block_signing_desc": "Enable optional block signatures for enhanced validation (adds ~690 bytes per submission)",
    
    "_section_tritium": "Tritium Account Binding (Optional)",
    "tritium_genesis": "<YOUR_GENESIS_64_HEX>",
    "_tritium_genesis_desc": "32-byte Tritium account genesis hash (hex) for reward binding",
    
    "keepalive_interval": 24,
    "_keepalive_desc": "Keep-alive ping interval in hours (1-168, default: 24)",
    
    "enable_chacha20_wrapping": false,
    "_chacha20_desc": "Enable ChaCha20 wrapping of Falcon pubkey (auto-enabled for remote mining)",
    
    "_section_tls": "TLS/HTTPS Configuration (Optional, auto-enabled for remote)",
    "enable_tls": false,
    "_tls_desc": "Enable TLS/SSL for encrypted connections (auto-detect for remote)",
    
    "tls_ca_cert_path": "",
    "_tls_ca_desc": "Path to CA certificate bundle (empty = system default)",
    
    "tls_verify_peer": true,
    "_tls_verify_desc": "Verify peer certificate (default: true)",
    
    "tls_server_name": "",
    "_tls_server_desc": "Server name for SNI (empty = use wallet_ip)",
    
    "_section_mtls": "Mutual TLS (Client Certificates) - Optional",
    "tls_client_cert_path": "",
    "_mtls_cert_desc": "Path to client certificate (PEM format)",
    
    "tls_client_key_path": "",
    "_mtls_key_desc": "Path to client private key (PEM format)",
    
    "tls_client_key_password": "",
    "_mtls_password_desc": "Password for encrypted client key (optional)",
    
    "_section_logging": "Logging Settings",
    "log_level": 2,
    "_log_level_desc": "0=trace, 1=debug, 2=info, 3=warn, 4=error, 5=critical",
    
    "logfile": "",
    "_logfile_desc": "Path to log file (empty = console only)",
    
    "_section_stats": "Statistics Settings",
    "print_statistics_interval": 10,
    "_stats_interval_desc": "Interval in seconds to print statistics",
    
    "stats_printers": [
        {
            "stats_printer": {
                "mode": "console"
            }
        },
        {
            "stats_printer": {
                "mode": "file",
                "filename": "stats.log"
            }
        }
    ],
    "_stats_printers_desc": "Stats output: 'console' and/or 'file'",
    
    "_section_advanced": "Advanced Settings",
    "connection_retry_interval": 5,
    "_retry_desc": "Seconds to wait before retrying connection (default: 5)",
    
    "get_height_interval": 2,
    "_height_desc": "DEPRECATED - Only for legacy mode (not used in Phase 2 stateless)",
    
    "ping_interval": 10,
    "_ping_desc": "DEPRECATED - Only for legacy pool mode (not used in solo)",
    
    "_section_workers": "Worker Configuration",
    "workers": [
        {
            "worker": {
                "id": "gpu0",
                "_worker_id_desc": "Unique worker identifier",
                "mode": {
                    "hardware": "gpu",
                    "_hardware_desc": "Worker type: 'cpu', 'gpu', or 'fpga'",
                    
                    "_gpu_section": "GPU-specific options",
                    "device": 0,
                    "_device_desc": "GPU device index (0, 1, 2, etc.)",
                    
                    "power_limit_percent": 80,
                    "_power_limit_desc": "GPU power limit: 50-100% (default: 100)",
                    
                    "core_clock_offset": 0,
                    "_core_clock_desc": "Core clock offset in MHz: -500 to +500 (default: 0)",
                    
                    "memory_clock_offset": 0,
                    "_mem_clock_desc": "Memory clock offset in MHz: -1000 to +1000 (default: 0)",
                    
                    "fan_speed": 0,
                    "_fan_speed_desc": "Fan speed: 0=auto, 1-100=fixed percentage (default: 0)",
                    
                    "target_hashrate": 0,
                    "_target_hash_desc": "Target hashrate limit: 0=maximum (default: 0)"
                }
            }
        },
        {
            "worker": {
                "id": "cpu0",
                "mode": {
                    "hardware": "cpu",
                    
                    "_cpu_section": "CPU-specific options",
                    "threads": 1,
                    "_threads_desc": "Number of threads per worker (default: 1)",
                    
                    "affinity_mask": 0,
                    "_affinity_desc": "CPU core affinity bitmask: 0=no affinity (default: 0)",
                    
                    "priority": 2,
                    "_priority_desc": "Thread priority: 0=low, 1=below_normal, 2=normal, 3=above_normal, 4=high (default: 2)",
                    
                    "power_limit_percent": 100,
                    "_cpu_power_desc": "CPU power limit: 50-100% (default: 100)",
                    
                    "hyperthreading": true,
                    "_hyperthreading_desc": "Enable hyperthreading/SMT cores (default: true)",
                    
                    "efficiency_cores": false,
                    "_efficiency_desc": "Use efficiency cores on hybrid CPUs (P-cores/E-cores) (default: false)",
                    
                    "target_hashrate": 0,
                    "_cpu_target_desc": "Target hashrate limit: 0=maximum (default: 0)"
                }
            }
        },
        {
            "worker": {
                "id": "fpga0",
                "mode": {
                    "hardware": "fpga",
                    "_fpga_note": "FPGA only supported for HASH channel",
                    "serial_port": "/dev/ttyUSB0"
                }
            }
        }
    ],
    
    "_usage_notes": [
        "1. Generate Falcon keys with: ./NexusMiner --create-keys",
        "2. Get Tritium genesis hash from: nexus list accounts",
        "3. Whitelist miner on node: -minerallowkey=<pubkey> in nexus.conf",
        "4. For multi-core CPU mining, create multiple CPU workers",
        "5. Power controls require appropriate hardware support",
        "6. Comments (fields starting with '_') are ignored by parser"
    ]
}
